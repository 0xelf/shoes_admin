<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='48' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Ccircle cx='11' cy='24' r='4.5' fill='white' opacity='0.85'/%3E%3Crect x='18' y='15' width='12' height='18' rx='3.5' fill='white'/%3E%3Cpath d='M21.8 20.2 L26 24 L21.8 27.8' fill='none' stroke='%234f46e5' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='37' cy='24' r='4.5' fill='white' opacity='0.85'/%3E%3C/svg%3E"
    />
    <title>shoes-admin · 代理管理面板</title>
    <script>
      // 首帧即应用主题（默认深色），避免刷新时闪烁浅色
      try {
        var t = JSON.parse(localStorage.getItem("shoes-admin-theme") || "null");
        var v = t && t.state ? t.state.theme : "dark";
        var dark = v === "dark" || (v === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
