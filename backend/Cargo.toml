[package]
name = "shoes-admin"
version = "0.1.0"
edition = "2021"
description = "shoes 代理服务器可视化管理面板"
license = "MIT"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
tar = "0.4"
flate2 = "1"
rust-embed = "8"
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
libc = "0.2"
webbrowser = "1"
mime_guess = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "wincon", "consoleapi"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
